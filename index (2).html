<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSM Cleaning Services · Pricing Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Open+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1F4F72;--brand-2:#163C58;--accent:#BD9B4E;--accent-2:#A5853C;--accent-soft:#FBF4E6;--sky:#FDF1EC;--peach:#FDF4F0;--ink:#2B3340;--muted:#6A7480;--line:#EDE4DE;
  --amber:#C9952E;--amber-bg:#FBF3E2;--red:#B8574E;--red-bg:#F9ECEA;--pend:#FFF4D6;--pend-ink:#7A5A00;
  --text:var(--ink);--sans:"Open Sans","Helvetica Neue",Arial,sans-serif;--head:"Quicksand","Open Sans",sans-serif;--script:"Pacifico",cursive;--r:16px;--r-sm:12px;--shadow:0 1px 2px rgba(14,58,93,.04),0 8px 24px rgba(14,58,93,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--text:#1B2430}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:#fff;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0}
h1{font-family:var(--head);font-size:34px;font-weight:700;line-height:1.15;color:var(--brand)}
h2{font-family:var(--head);font-size:24px;font-weight:700;color:var(--brand)}
h3{font-family:var(--head);font-size:13px;font-weight:700;color:var(--brand);letter-spacing:.08em;text-transform:uppercase}
.eyebrow{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--accent);border-radius:2px}
h4{font-size:13px;font-weight:700;color:var(--muted)}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{justify-content:space-between}
.app{display:flex;min-height:100%}
.sidebar{width:252px;flex:0 0 252px;background:var(--peach);border-right:1px solid var(--line);padding:30px 18px 24px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column}
.wordmark{display:flex;align-items:center;gap:10px;margin:0 6px 28px}
.wordmark .mk{width:40px;height:40px;display:grid;place-items:center}
.wordmark .mk svg{width:40px;height:40px}
.wordmark b{display:block;font-family:var(--script);font-weight:400;font-size:30px;color:var(--brand);line-height:1}
.wordmark small{display:block;font-family:var(--head);font-size:9.5px;color:var(--accent-2);letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:2px}
.wordmark img{max-width:200px;height:auto}
.topbar .wordmark img{max-width:120px}
.quote .wordmark img{max-width:170px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);color:var(--text);text-align:left;position:relative;font-weight:600}
.nav button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;color:var(--muted);flex:none}
.nav button:hover{background:#fff}
.nav button.active{background:var(--brand);color:#fff}
.nav button.active svg{color:var(--accent)}
.nav .group{margin:16px 12px 6px;font-size:11px;color:var(--accent-2);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-family:var(--head)}
.sidebar .foot{margin-top:auto;padding-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.main{flex:1;min-width:0;padding:36px 40px 80px;max-width:1340px}
.topbar{display:none}
@media (max-width:960px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.12);padding-top:calc(28px + env(safe-area-inset-top,0px))}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(14,58,93,.35);z-index:39;display:none}.scrim.show{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px}
  .topbar .burger{margin-left:auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.page-head{margin-bottom:22px;display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.page-head p{margin-top:6px;max-width:600px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

@media (max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.card.peach{background:var(--peach);border-color:transparent;box-shadow:none}
.card.navy{background:var(--brand);color:#fff;border-color:transparent}
.card.navy h3,.card.navy .sub{color:#fff}.card.navy .sub{opacity:.8}
.ico{width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin-bottom:10px}

.card.flat{box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-family:var(--head);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px;border:1px solid transparent;transition:background .15s;white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-2)}
.btn.accent{background:var(--brand);color:#fff}
.btn.ghost{border-color:var(--line);background:#fff;color:var(--brand)}.btn.ghost:hover{background:var(--peach)}
.btn.sm{padding:8px 14px;font-size:12px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;width:100%;min-height:44px;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.field textarea{resize:vertical;min-height:64px}
.field .hint{font-size:12px;color:var(--muted);line-height:1.4}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}}
.form-grid .full{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--muted);min-height:38px}
.seg button.on{background:var(--brand)!important;border-color:var(--brand);color:#fff}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;min-height:44px}
.stepper .n{font-size:13.5px}.stepper .n small{display:block;color:var(--muted);font-size:11.5px}
.stepper .q{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.stepper .q button{width:30px;height:30px;color:var(--brand);font-weight:800;font-size:16px}

.stepper.on{border-color:var(--brand)}
.svcpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.svcpick button{border:1px solid transparent;border-radius:18px;padding:16px;text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--peach)}
.svcpick button svg{width:30px;height:30px;padding:7px;border-radius:50%;background:var(--accent);stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.svcpick button b{display:block;font-family:var(--head);font-weight:700;color:var(--brand);font-size:15px}
.svcpick button small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.svcpick button.on{background:var(--brand)}
.svcpick button.on b,.svcpick button.on small{color:#fff}.svcpick button.on small{opacity:.8}
.panel{background:var(--peach);border-radius:18px;padding:18px;margin-top:14px}
.panel .field input,.panel .field select,.panel .field textarea,.panel .stepper,.panel .addon,.panel .seg button{background:#fff}
.panel h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3>svg{width:15px;height:15px;stroke:var(--accent-2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.panel h3 .rm{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.est{display:grid;grid-template-columns:460px 1fr;gap:20px;align-items:start}
@media (max-width:1200px){.est{grid-template-columns:400px 1fr}}
@media (max-width:960px){.est{grid-template-columns:1fr}}
.res-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.addons{display:grid;grid-template-columns:1fr;gap:6px;max-height:340px;overflow:auto;padding-right:4px}
.addon{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 6px 0 0}
.addon .t{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;text-align:left;font-size:13.5px}
.addon .t small{color:var(--muted);font-size:11px}
.addon .t b{color:var(--brand);font-weight:700;white-space:nowrap}
.addon.on{border-color:var(--accent);background:var(--accent-soft)!important}
.addon .qty{display:inline-flex;align-items:center;border:1px solid var(--brand);border-radius:999px;background:#fff;font-size:13px}
.addon .qty button{width:28px;height:28px;color:var(--brand);font-weight:800}
.addon .qty span{min-width:18px;text-align:center;font-weight:700}
.summary{background:var(--brand);color:#fff;border-radius:22px;padding:28px;position:relative;overflow:hidden}
.summary::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:var(--accent);opacity:.18}
.summary .lbl{font-size:13px;opacity:.85;font-weight:600}
.summary .num{font-family:var(--head);font-size:58px;font-weight:700;line-height:1;margin:6px 0 4px;color:#fff}
.summary .per{font-size:13px;opacity:.8}
.summary .pill.pend{background:var(--accent);color:#fff}
.summary .btn.ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.summary .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.tierbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;position:relative;z-index:1}
.tierbtns button{border:1.5px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.08);color:#fff}
.tierbtns button small{font-size:11px;opacity:.8}
.tierbtns button b{font-family:var(--head);font-size:20px;font-weight:700}
.tierbtns button.on{background:var(--accent);border-color:var(--accent)}
@media (max-width:600px){.tierbtns{grid-template-columns:1fr}}
.lines{display:flex;flex-direction:column}
.lines div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:flex-start}
.lines div:last-child{border-bottom:0}
.lines small{display:block;color:var(--muted);font-size:12px}
.lines b{font-weight:700;color:var(--ink);white-space:nowrap}
.lines div.disc b{color:var(--accent)}
.lines div.grp{background:var(--peach);margin:6px -8px 0;padding:6px 8px;border-radius:8px;border:0;font-family:var(--head);font-weight:700;color:var(--brand);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.lines div.tot{border-top:2px solid var(--accent);margin-top:4px;padding-top:12px}
.lines div.tot b{font-family:var(--head);font-size:24px;font-weight:700;color:var(--brand)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45}
.note.warn{background:var(--amber-bg);color:#6B4D0E}.note.crit{background:var(--red-bg);color:#7A3029}.note.ok{background:var(--accent-soft);color:#1E6B45}.note.info{background:var(--peach);color:var(--brand)}
.note svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:#1E6B45}.pill.warn{background:var(--amber-bg);color:#6B4D0E}.pill.crit{background:var(--red-bg);color:#7A3029}.pill.pend{background:var(--pend);color:var(--pend-ink)}.pill.info{background:var(--peach);color:var(--brand)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px}
@media (max-width:600px){.kv{grid-template-columns:repeat(2,1fr)}}
.kv div{padding:10px 0;border-bottom:1px solid var(--line)}
.kv .k{font-size:12px;color:var(--muted)}.kv .v{font-family:var(--head);font-size:19px;font-weight:700;color:var(--brand);margin-top:2px}
details.card{padding:0}
details.card summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
details.card summary::-webkit-details-marker{display:none}
details.card summary .chev{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
details.card[open] summary .chev{transform:rotate(180deg)}
details.card .body{padding:0 22px 22px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.list{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.list th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.list td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tr:last-child td{border-bottom:0}
.list td.num,.list th.num{text-align:right}
.list input.cell{width:100%;min-width:110px;border:1px solid transparent;border-radius:8px;padding:6px 8px;background:transparent}
.list input.cell.num{min-width:64px;text-align:right}
.list input.cell:focus{border-color:var(--brand);background:#fff;outline:none}
.empty{text-align:center;padding:40px 24px;border-radius:20px;background:var(--peach);color:var(--brand)}
.empty h3{font-size:18px;text-transform:none;letter-spacing:0;margin-bottom:6px}
.empty.soft{background:var(--peach);border:0;color:var(--muted);text-align:left}
.empty.soft h3{text-align:left}
.sticky{display:none}
@media (max-width:960px){
  .sticky.show{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--brand);color:#fff;border:0;border-radius:16px;padding:12px 16px;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(14,58,93,.18)}
  .sticky .l{font-size:12px;opacity:.8}.sticky .p{font-family:var(--head);font-size:24px;line-height:1;font-weight:700}
  .sticky .btn{margin-left:auto;background:var(--accent);color:#fff;padding:9px 14px}
}
.modal{position:fixed;inset:0;background:rgba(14,58,93,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal.show{display:flex}
.quote{background:#fff;color:#1B2430;width:100%;max-width:760px;border-radius:18px;padding:42px 46px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
@media (max-width:600px){.quote{padding:26px 20px}}
.quote .tools{display:flex;gap:8px;justify-content:flex-end;margin-bottom:18px}
.quote .qhead{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:2px solid #BD9B4E;padding-bottom:18px}
.quote .qhead .co{text-align:right;font-size:12.5px;color:#66717D;line-height:1.5}
.quote .qtitle{font-family:var(--head);font-size:30px;font-weight:700;color:#1F4F72;margin:24px 0 2px}
.quote .qsub{color:#66717D;font-size:14px}
.quote .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;margin:22px 0;padding:18px;background:#FDF4F0;border-radius:16px}
@media (max-width:600px){.quote .qgrid{grid-template-columns:1fr}}
.quote .qgrid .k{font-size:12px;color:#66717D}.quote .qgrid .v{font-weight:600;margin-top:2px}
.quote .qlines div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #EEF1F3;font-size:14px}
.quote .qlines div.grp{font-family:var(--head);font-weight:700;color:#1F4F72;border-bottom:0;padding-top:12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.quote .qlines div span:last-child{color:#1F4F72;font-weight:600}
.quote .total{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-radius:18px;background:#1F4F72;color:#fff;margin-top:18px}
.quote .total .l{font-size:14px}.quote .total .l small{display:block;font-size:12px;opacity:.8}
.quote .total .p{font-family:var(--head);font-size:40px;font-weight:700;line-height:1;color:#F3D48A}
.quote .qfoot{margin-top:26px;padding-top:14px;border-top:1px solid #EDE4DE;font-size:12px;color:#66717D;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media print{body *{visibility:hidden}.modal,.modal *{visibility:visible}.modal{position:static;background:none;padding:0;display:block}.quote{box-shadow:none;max-width:none;border-radius:0}.quote .tools{display:none}}
</style>
</head>
<body>
<div class="topbar"><div class="wordmark" style="margin:0" id="wm-top"></div><button class="burger" aria-label="Open menu" onclick="toggleNav(true)"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
<div class="scrim" id="scrim" onclick="toggleNav(false)"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="wordmark" id="wm-side"></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Pricing Calculator<br>Centralia, WA · 25-mile radius</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="sticky" id="sticky"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeQuote()"><div class="quote" id="quote"></div></div>

const $=(n,d=0)=>"$"+(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

/* ===================== PRICING ENGINE ===================== */
function lerpTable(T,sqft,col){ /* bracket tops in T[i][0]; interpolate between bracket tops, extend beyond last */
  if(sqft<=T[0][0]) return T[0][col];
  for(let i=1;i<T.length;i++){ if(sqft<=T[i][0]){const a=T[i-1],b=T[i];const f=(sqft-a[0])/(b[0]-a[0]);return a[col]+(b[col]-a[col])*f} }
  const a=T[T.length-2],b=T[T.length-1];return b[col]+(b[col]-a[col])*((sqft-b[0])/(b[0]-a[0]));
}
const RES_OPTS={initial:"Initial Cleaning",weekly:"Weekly",biweekly:"Bi-Weekly",monthly:"Monthly",deep:"Deep Cleaning",movein:"Move-In",move:"Move-Out"};
const RECUR={weekly:"weekly",biweekly:"every two weeks",monthly:"monthly"};
function resIdx(type){const k=type==="movein"?"move":type;const i=S.resTypes.findIndex(t=>t[0]===k);return i<0?3:i}
function resBracket(sqft){const st=S.resStep||500;const top=Math.max(st,Math.ceil(sqft/st)*st);return top}
function resPrice(sqft,typeIdx,be){const top=resBracket(sqft);const v=lerpTable(be?S.resBE:S.resRef,top,typeIdx+1);return be?v:v*(1-(S.resAdjust||0)/100)}
function pcSize(sqft){const t=S.postcon.thresholds;return sqft<=t.small?0:sqft<=t.medium?1:2}
function abProd(sqft){for(const p of S.airbnb.production){if(sqft<=p[0])return p[1]}return 400}
const AB_TYPES={standard:["Standard turnover","Routine cleaning and preparation for the next guest",1],heavy:["Heavy-duty turnover","More dirt, extra scrubbing or unusually messy conditions",2],deep:["Deep cleaning","Detailed cleaning beyond the standard turnover scope",3]};
const AB_TURN={standard:["Standard turnover","Full reset between guests: kitchen, bathrooms, beds, floors and staging",2],midstay:["Mid-stay refresh","Light refresh during a longer stay: tidy, bathrooms, kitchen touch-up, trash",4],onboard:["First / onboarding clean","First clean of a new listing, bringing it up to guest-ready standard",6],deep:["Deep clean (quarterly)","Detailed top-to-bottom clean every quarter, beyond the turnover scope",8]};
function abRow(sqft){const T=S.airbnb.turn;for(let i=0;i<T.length;i++){if(sqft<=T[i][0])return {row:T[i],lo:i?T[i-1][0]+1:0,hi:T[i][0]}}
  const a=T[T.length-2],b=T[T.length-1],step=b[0]-a[0],k=Math.ceil((sqft-b[0])/step);const row=b.map((v,c)=>c===0?b[0]+k*step:+(v+(v-a[c])*k).toFixed(c===1?1:0));return {row,lo:row[0]-step+1,hi:row[0]}}
function abTurnPrice(sqft,ttype,tier){const r=abRow(sqft).row,c=(AB_TURN[ttype]||AB_TURN.standard)[2];return tier==="low"?r[c+1]:Math.round(r[c]*(tier==="prem"?1+(S.tiers.prem||0)/100:1))}
function abBand(sqft){const B=abRow(sqft);return B.lo?`${B.lo.toLocaleString()}–${B.hi.toLocaleString()} ft²`:`up to ${B.hi.toLocaleString()} ft²`}
function abTurnHours(sqft,ttype){const r=abRow(sqft).row,c=(AB_TURN[ttype]||AB_TURN.standard)[2];return r[1]*(r[c]/r[2])}
function abRate(sqft,type){const i=AB_TYPES[type]?.[2]||1;for(const t of S.airbnb.tiers){if(sqft<=t[0])return t[i]}return S.airbnb.tiers[S.airbnb.tiers.length-1][i]}

function calc(e){
  const r=calcTier(e,e.tier||"rec"); if(!r||r.empty) return r;
  r.tierPrices={}; for(const t of ["low","rec","prem"]){r.tierPrices[t]=t===e.tier?r.final:calcTier(e,t).final}
  return r;
}
function calcTier(e,tier){
  const tf=1+((S.tiers||{})[tier]||0)/100;
  const sel=Object.keys(e.services).filter(k=>e.services[k]);
  if(!sel.length) return null;
  const groups=[]; let laborHours=0; const pending=[]; const subCosts=[];
  const L=S.labor;
  const add=(g,n,s,v,opt={})=>g.lines.push({n,s,v:(opt.fixed?v:v*tf),...opt});
  for(const k of sel){
    const g={key:k,name:SVC[k].name,lines:[],sub:0,subPct:null};
    if(k==="residential"){
      const r=e.res,sq=num(r.sqft);if(!sq){groups.push({...g,empty:true});continue}
      const idx=resIdx(r.type),label=RES_OPTS[r.type]||S.resTypes[idx][1],min=S.standaloneMin;
      const visit=Math.max(min,resPrice(sq,idx,false)*tf);
      const band=`${sq.toLocaleString()} ft² · up to ${resBracket(sq).toLocaleString()} ft² bracket`;
      let be=resPrice(sq,idx,true);
      if(RECUR[r.type]&&r.firstVisit!==false){
        const ini=resPrice(sq,0,false);be=resPrice(sq,0,true);
        add(g,`First visit · Initial Cleaning · ${sq.toLocaleString()} ft²`,`then ${label} ${$(visit)} per visit`,Math.max(min,ini*tf),{fixed:true});
        g.recurring={label,price:visit,freq:RECUR[r.type]};
      }else{
        add(g,`${label} · ${band.split(" · ")[0]}`,band.split(" · ")[1]+(RECUR[r.type]?" · per visit":""),visit,{fixed:true});
        if(RECUR[r.type])g.recurring={label,price:visit,freq:RECUR[r.type]};
      }
      g.breakeven=be;
      const condF={light:1,standard:1,heavy:1.2,extreme:1.4}[r.condition]||1;
      laborHours+=(be/S.breakevenRate)*condF; /* hours implied by the breakeven table */
      for(const a of S.addons){const q=parseInt((r.addons||{})[a[0]])||0;if(q)add(g,a[1]+(q>1?" × "+q:""),"add-on · "+a[3],a[2]*q,{fixed:true})}
    }else if(k==="airbnb"){
      const a=e.ab,sq=num(a.sqft);if(!sq){groups.push({...g,empty:true});continue}
      if((a.method||"table")==="table"){
        const T=AB_TURN[a.ttype]||AB_TURN.standard,B=abRow(sq),hrs=abTurnHours(sq,a.ttype);
        g.name="Airbnb · "+T[0];
        add(g,`${T[0]} · ${sq.toLocaleString()} ft²`,`${abBand(sq)} · ${hrs.toFixed(1)} est. hours`,abTurnPrice(sq,a.ttype,tier),{fixed:true});
        laborHours+=hrs; g.hours=hrs;
      }else{
        const T=AB_TYPES[a.type]||AB_TYPES.standard, rate=abRate(sq,a.type);
        g.name="Airbnb · "+T[0];
        add(g,`${T[0]} · ${sq.toLocaleString()} ft²`,`${$(rate,2)}/ft² at this size`,sq*rate);
        const typeF={standard:1,heavy:1.3,deep:1.5}[a.type]||1;
        const hrs=(sq/abProd(sq))*typeF+(a.bedsMade||0)*0.15+(a.baths||0)*0.25; laborHours+=hrs; g.hours=hrs;
        g.refHours=sq/abProd(sq); g.refPrice=g.refHours*S.refRate;
      }
      if(a.bedsMade&&S.airbnb.perBed)add(g,`Beds prepared × ${a.bedsMade}`,$(S.airbnb.perBed)+" each",a.bedsMade*S.airbnb.perBed);
      if(a.fridge&&S.airbnb.fridge)add(g,"Refrigerator & kitchen reset","",S.airbnb.fridge);
      if(a.dishes&&S.airbnb.dishes)add(g,"Dishes / dishwasher","",S.airbnb.dishes);
      if(a.food&&S.airbnb.foodRemoval)add(g,"Leftover food removal","",S.airbnb.foodRemoval);
      for(const x of S.addons){const q=parseInt((a.addons||{})[x[0]])||0;if(q)add(g,x[1]+(q>1?" × "+q:""),"add-on · "+x[3],x[2]*q,{fixed:true})}
    }else if(k==="laundry"){
      const n=parseInt(e.la.loads)||0;if(!n){groups.push({...g,empty:true});continue}
      add(g,`Laundry · ${n} load${n>1?"s":""}`,$(S.laundry.perLoad)+" per load, first load included",n*S.laundry.perLoad,{fixed:true});
      laborHours+=n*0.25; /* handling only; machine time runs while cleaners work */
    }else if(k==="power"){
      const p=e.pw,sq=num(p.sqft);if(!sq){groups.push({...g,empty:true});continue}
      add(g,`Power washing · ${sq.toLocaleString()} ft²`,`${$(S.power.rate,2)}/ft²${p.surface?" · "+p.surface:""}`,sq*S.power.rate);
      laborHours+=sq/L.production.power; g.subPct=num(e.adj.subPct.power)||S.sub.power;
    }else if(k==="carpet"){
      const c=e.cp;
      if(c.method==="supplier"){
        const cost=num(c.supplierCost);if(!cost){groups.push({...g,empty:true});continue}
        const p=num(c.subPct)||S.carpet.subPct;const price=cost/(p/100);
        add(g,"Carpet cleaning · from supplier cost",`supplier ${$(cost)} ÷ ${p}% payment`,price);
        g.sub=cost;g.subPct=p;
      }else if(c.method==="room"){
        const n=parseInt(c.rooms)||0;if(!n){groups.push({...g,empty:true});continue}
        add(g,`Carpet cleaning · ${n} room${n>1?"s":""}`,`${$(S.carpet.perRoom,2)} per room · reference, pending`,n*S.carpet.perRoom,{pend:true});
        g.subPct=num(c.subPct)||S.carpet.subPct;pending.push("Carpet per-room rate is a reference from a recent job ($230 / 3 rooms), not confirmed.");
      }else{
        const sq=num(c.sqft);if(!sq){groups.push({...g,empty:true});continue}
        add(g,`Carpet cleaning · ${sq.toLocaleString()} ft²`,`${$(S.carpet.rate,2)}/ft² · preliminary, pending supplier confirmation`,sq*S.carpet.rate,{pend:true});
        g.subPct=num(c.subPct)||S.carpet.subPct;pending.push("Carpet $/ft² is preliminary; confirm the supplier's real rate and minimum.");
      }
      if(num(c.stain))add(g,"Stain treatment / extras","",num(c.stain),{fixed:true});
      if(num(c.travel))add(g,"Travel charge","",num(c.travel),{fixed:true});
    }else if(k==="postcon"){
      const p=e.pc,sq=num(p.sqft);const ph=Object.keys(p.phases).filter(x=>p.phases[x]);
      if(!sq||!ph.length){groups.push({...g,empty:true});continue}
      const sz=p.size==="auto"?pcSize(sq):{small:0,medium:1,large:2}[p.size];const szName=["Small","Medium","Large"][sz];
      const names={rough:"Rough Clean",final:"Final Clean",touch:"Touch-up Clean"};
      for(const x of ph){const rate=S.postcon.rates[x][sz];add(g,`${names[x]} · ${sq.toLocaleString()} ft²`,`${szName} project · ${$(rate,2)}/ft² · preliminary`,sq*rate,{pend:true})}
      pending.push("Post-construction rates and size thresholds are preliminary (thresholds not yet established).");
      const prodF={rough:1,final:1.4,touch:0.6};laborHours+=ph.reduce((a,x)=>a+(sq/L.production.postcon)*prodF[x],0);
      g.subPct=num(e.adj.subPct.postcon)||S.sub.postcon;
    }
    g.total=g.lines.reduce((a,l)=>a+l.v,0);
    if(g.subPct&&!g.sub)g.sub=g.total*g.subPct/100;
    groups.push(g);
  }
  const active=groups.filter(g=>!g.empty);
  if(!active.length)return {groups,empty:true};
  const standalone=active.length===1;
  let subtotal=active.reduce((a,g)=>a+g.total,0);
  let minAdj=0;
  if(subtotal<S.standaloneMin){minAdj=S.standaloneMin-subtotal}
  let calcPrice=subtotal+minAdj;
  const discount=num(e.adj.discount),custom=num(e.adj.custom);
  const final=Math.max(0,calcPrice-discount+custom);
  const adjusted=discount!==0||custom!==0;
  /* internal */
  const laborCost=(num(e.adj.laborHours)||laborHours)*(L.hourly*(1+L.burden/100));
  const subTotal=active.reduce((a,g)=>a+(g.sub||0),0);
  const gross=final-laborCost-subTotal, gm=final?gross/final:0;

  const resBE=active.find(g=>g.key==="residential")?.breakeven;
  return {tier,groups:active,allGroups:groups,standalone,subtotal,minAdj,calcPrice,discount,custom,final,adjusted,laborHours:num(e.adj.laborHours)||laborHours,laborCost,subTotal,gross,gm,recurring:active.find(g=>g.recurring)?.recurring,pending:[...new Set(pending)],subFlag,resBE};
}

  <div class="svcpick">${Object.entries(SVC).map(([k,s])=>`<button onclick="startWith(['${k}'])">${ic(s.ic)}<span><b>${s.name}</b><small>${s.desc}</small></span></button>`).join("")}</div>

      <button class="btn ghost sm" onclick="startWith(['postcon'],{pc:{sqft:12000,phases:{rough:true,final:true,touch:true},size:'auto',notes:''}})">Post-con 12,000 ft² · 3 phases</button>
      <button class="btn ghost sm" onclick="startWith(['carpet'],{cp:{method:'supplier',sqft:'',rooms:0,supplierCost:140,subPct:70,stain:'',travel:'',notes:''}})">Carpet from supplier $140</button>
    </div></div>
    <div class="card navy"><h3 style="margin-bottom:12px">Rules in force</h3><ul class="small" style="margin:0;padding-left:18px;line-height:1.7;opacity:.95"><li>Visit minimum $${S.standaloneMin} on every visit, recurring visits included</li><li>Recurring service: first visit at the Initial Cleaning price, then the recurring rate</li><li>Power washing ${$(S.power.rate,2)}/ft²</li><li>Airbnb turnover table by 500 ft² bracket: standard, mid-stay, onboarding and quarterly deep clean</li><li>Laundry ${$(S.laundry.perLoad)} per load, separate from turnover</li><li>Residential brackets every ${S.resStep} ft², interpolated from the 500 ft² tables</li><li>Subcontractor payment 50–70% of customer price, flagged above ${S.sub.flagAbove}%</li></ul></div>

  </div>`;

/* ---------- form helpers ---------- */
function field(l,i,h=""){return `<div class="field"><label>${l}</label>${i}${h?`<div class="hint">${h}</div>`:""}</div>`}
function inp(path,ph="",type="text",attrs=""){return `<input type="${type}" ${attrs} placeholder="${ph}" value="${get(path)??""}" oninput="setE('${path}',this.value)">`}
function sel(path,opts){return `<select onchange="setE('${path}',this.value,true)">${Object.entries(opts).map(([v,l])=>`<option value="${v}" ${get(path)==v?"selected":""}>${l}</option>`).join("")}</select>`}
function seg(path,opts){return `<div class="seg">${Object.entries(opts).map(([v,l])=>`<button class="${get(path)==v?"on":""}" onclick="setE('${path}','${v}',true)">${l}</button>`).join("")}</div>`}
function step(path,name,sub){const q=parseInt(get(path))||0;return `<div class="stepper ${q?"on":""}"><div class="n">${name}<small>${sub}</small></div><div class="q"><button onclick="setE('${path}',${Math.max(0,q-1)},true)">−</button><span>${q}</span><button onclick="setE('${path}',${q+1},true)">+</button></div></div>`}
function chk(path,label){return `<label class="row" style="gap:8px;font-size:14px;cursor:pointer"><input type="checkbox" ${get(path)?"checked":""} onchange="setE('${path}',this.checked,true)"> ${label}</label>`}
function get(path){return path.split(".").reduce((o,k)=>o?.[k],E)}
function setE(path,v,rerender){const p=path.split(".");let o=E;for(let i=0;i<p.length-1;i++){o[p[i]]=o[p[i]]||{};o=o[p[i]]}o[p[p.length-1]]=v;if(rerender){render();return}R=calc(E);const r=document.getElementById("results");if(r)r.innerHTML=vResults();updateSticky()}
function toggleSvc(k){E.services[k]=!E.services[k];render()}
function toggleAddon(id,sc="res"){const o=E[sc].addons=E[sc].addons||{};if(o[id])delete o[id];else o[id]=1;render()}
function stepAddon(id,d,sc="res"){const o=E[sc].addons=E[sc].addons||{};const q=(parseInt(o[id])||0)+d;if(q<=0)delete o[id];else o[id]=q;render()}
function addonList(sc){const o=E[sc].addons||{};return `<div class="addons" style="margin-top:6px">${S.addons.map(a=>{const q=parseInt(o[a[0]])||0;const each=/each|per room|per window|per bathroom|per pet|per load/.test(a[3]);return `<div class="addon ${q?"on":""}"><button class="t" onclick="toggleAddon('${a[0]}','${sc}')"><span>${a[1]} <small>${a[3]}</small></span><b>${$(a[2])}</b></button>${q&&each?`<span class="qty"><button onclick="stepAddon('${a[0]}',-1,'${sc}')">−</button><span>${q}</span><button onclick="stepAddon('${a[0]}',1,'${sc}')">+</button></span>`:""}</div>`}).join("")}</div>`}

function vEstimate(){
  R=calc(E);
  const chosen=Object.keys(E.services).filter(k=>E.services[k]);
  const cond=p=>field("Condition",seg(p,{light:"Light",standard:"Standard",heavy:"Heavy",extreme:"Extreme"}),"Heavy +20% / Extreme +40% on labor time (and Airbnb price)");
  let panels="";
  if(E.services.residential) panels+=`<div class="panel"><h3>Residential <button class="rm" onclick="toggleSvc('residential')">remove</button></h3><div class="form-grid">
    ${field("Square footage",inp("res.sqft","e.g. 1,800","number",'inputmode="decimal" min="0"'),E.res.sqft?`Bracket up to ${resBracket(num(E.res.sqft)).toLocaleString()} ft²`:"")}
    ${field("Service",sel("res.type",RES_OPTS))}${RECUR[E.res.type]?`<div class="full">${chk("res.firstVisit","First visit priced as an Initial Cleaning, then the "+RES_OPTS[E.res.type].toLowerCase()+" rate applies")}</div>`:""}
    <div class="full">${cond("res.condition")}</div>
    <div class="full"><label class="field" style="font-size:13px;font-weight:600;color:var(--muted)">Add-ons</label>${addonList("res")}</div>
  </div></div>`;
  if(E.services.airbnb){const am=E.ab.method||"table",asq=num(E.ab.sqft);
  panels+=`<div class="panel"><h3>Airbnb <button class="rm" onclick="toggleSvc('airbnb')">remove</button></h3><div class="form-grid">
    <div class="full">${field("Pricing method",seg("ab.method",{table:"Turnover table",rate:"Per ft² rate"}),am==="table"?"Flat price by square footage bracket":"Price per ft² by size tier")}</div>
    ${am==="table"?`<div class="full">${field("Type of clean",seg("ab.ttype",Object.fromEntries(Object.entries(AB_TURN).map(([k,t])=>[k,t[0]]))),AB_TURN[E.ab.ttype]?.[1]||"")}</div>
    <div class="full">${field("Price level",`<div class="seg">${[["low","Minimum"],["rec","Suggested"],["prem","Premium +"+S.tiers.prem+"%"]].map(([k,l])=>`<button class="${E.tier===k?"on":""}" onclick="setE('tier','${k}',true)">${l}</button>`).join("")}</div>`,"Linked to the Low · Recommended · Premium buttons on the price card")}</div>
    ${field("Square footage",inp("ab.sqft","e.g. 1,800","number",'inputmode="decimal" min="0"'),asq?(()=>{return `Bracket ${abBand(asq)} · ${abTurnHours(asq,E.ab.ttype).toFixed(1)} est. hours · minimum ${$(abTurnPrice(asq,E.ab.ttype,"low"))}, suggested ${$(abTurnPrice(asq,E.ab.ttype,"rec"))}`})():"Brackets every 500 ft² up to 4,000 ft²; larger homes continue the same step")}`
    :`<div class="full">${field("Type of clean",seg("ab.type",Object.fromEntries(Object.entries(AB_TYPES).map(([k,t])=>[k,t[0]]))),AB_TYPES[E.ab.type]?.[1]||"")}</div>
    ${field("Square footage",inp("ab.sqft","e.g. 2,000","number",'inputmode="decimal" min="0"'),asq?`Rate at this size: ${$(abRate(asq,E.ab.type),2)}/ft² · ${(asq/abProd(asq)).toFixed(1)} labor-hours`:"Tiers: ≤1,000 · ≤2,000 · ≤3,000 · ≤4,000 · 4,001+")}`}
    ${step("ab.bedsMade","Beds to prepare",S.airbnb.perBed?$(S.airbnb.perBed)+" each":"included")}
    ${step("ab.beds","Bedrooms","")}${step("ab.baths","Bathrooms",am==="table"?"for the job notes":"adds labor time")}
    <div class="full row" style="gap:16px">${chk("ab.fridge","Refrigerator & kitchen")}${chk("ab.dishes","Dishes / dishwasher")}${chk("ab.food","Leftover food removal")}</div>
    <div class="full"><label class="field" style="font-size:13px;font-weight:600;color:var(--muted)">Add-ons</label>${addonList("ab")}</div>
    <div class="full">${field("Extra tasks from the property manager",`<textarea oninput="setE('ab.tasks',this.value)">${E.ab.tasks}</textarea>`,"Laundry is separate: add it from the service picker ($"+S.laundry.perLoad+" per load)")}</div>
  </div></div>`;}
  if(E.services.laundry) panels+=`<div class="panel"><h3>Laundry <button class="rm" onclick="toggleSvc('laundry')">remove</button></h3><div class="form-grid">${step("la.loads","Loads",$(S.laundry.perLoad)+" per load, first load included")}<div class="field"><label>&nbsp;</label><div class="hint">About 40 min wash + 40 min dry per cycle; machine time is not counted as active labor.</div></div></div></div>`;
  if(E.services.power) panels+=`<div class="panel"><h3>Power washing <button class="rm" onclick="toggleSvc('power')">remove</button></h3><div class="form-grid">
    ${field("Surface area (ft²)",inp("pw.sqft","e.g. 500","number",'inputmode="decimal" min="0"'),$(S.power.rate,2)+" per ft²")}
    ${field("Surface type",inp("pw.surface","Driveway, siding, deck…"))}
    ${field("Dirt / staining",seg("pw.soil",{light:"Light",standard:"Standard",heavy:"Heavy"}),"Note only; no automatic surcharge")}
    ${field("Access & equipment",inp("pw.access","Ladder, water source, hot water…"))}
    <div class="full">${field("Special treatment notes",inp("pw.notes","Oil stains, moss, rust…"))}</div>
  </div></div>`;
  if(E.services.carpet) panels+=`<div class="panel"><h3>Carpet cleaning <span class="pill pend">supplier rate pending</span><button class="rm" onclick="toggleSvc('carpet')">remove</button></h3><div class="form-grid">
    <div class="full">${field("Pricing method",seg("cp.method",{sqft:"Per ft²",room:"Per room",supplier:"From supplier cost"}))}</div>
    ${E.cp.method==="sqft"?field("Carpet ft²",inp("cp.sqft","e.g. 600","number",'inputmode="decimal" min="0"'),$(S.carpet.rate,2)+"/ft² preliminary"):E.cp.method==="room"?step("cp.rooms","Rooms",$(S.carpet.perRoom,2)+" each, reference"):field("Supplier quote ($)",inp("cp.supplierCost","e.g. 140","number",'inputmode="decimal" min="0"'),"Customer price = supplier cost ÷ payment %")}
    ${field("Subcontractor payment %",inp("cp.subPct",String(S.carpet.subPct),"number",'inputmode="numeric" min="0" max="100"'),"Typical 50–70% of the customer price")}
    ${field("Stain treatment / extras ($)",inp("cp.stain","0","number",'inputmode="decimal" min="0"'))}
    ${field("Travel charge ($)",inp("cp.travel","0","number",'inputmode="decimal" min="0"'))}
  </div></div>`;
  if(E.services.postcon) panels+=`<div class="panel"><h3>Post-construction <span class="pill pend">rates & thresholds pending</span><button class="rm" onclick="toggleSvc('postcon')">remove</button></h3><div class="form-grid">
    ${field("Project ft²",inp("pc.sqft","e.g. 12,000","number",'inputmode="decimal" min="0"'),E.pc.sqft?`Auto size: ${["Small","Medium","Large"][pcSize(num(E.pc.sqft))]} (small ≤ ${S.postcon.thresholds.small.toLocaleString()}, medium ≤ ${S.postcon.thresholds.medium.toLocaleString()})`:"")}
    ${field("Project size",seg("pc.size",{auto:"Auto",small:"Small",medium:"Medium",large:"Large"}))}
    <div class="full"><label class="field" style="font-size:13px;font-weight:600;color:var(--muted)">Phases (each priced independently)</label><div class="row" style="gap:16px;margin-top:6px">${chk("pc.phases.rough","Rough Clean")}${chk("pc.phases.final","Final Clean")}${chk("pc.phases.touch","Touch-up Clean")}</div><div class="hint" style="margin-top:6px">Windows, exterior power washing and adhesive/paint removal are quoted separately. Add Power Washing from the picker if needed.</div></div>
  </div></div>`;
  return `<div class="page-head"><div><div class="eyebrow">Get a quote</div><h1>New quote</h1><p class="sub">Pick one or more services for the same visit. Every visit has a $${S.standaloneMin} minimum.</p></div></div>
  <div class="est"><div class="card">
    <h3 style="margin-bottom:10px">1 · Services in this visit</h3>
    <div class="svcpick" style="grid-template-columns:repeat(2,1fr)">${Object.entries(SVC).map(([k,s])=>`<button class="${E.services[k]?"on":""}" onclick="toggleSvc('${k}')">${ic(s.ic)}<span><b>${s.name}</b><small>${s.desc}</small></span></button>`).join("")}</div>
    ${panels?`<h3 style="margin:22px 0 0">2 · Job details</h3>${panels}`:""}
    <div class="panel"><h3>Client</h3><div class="form-grid">${field("Client name",inp("client","Jane Doe"))}${field("Address",inp("address","Street, City, WA"))}<div class="full">${field("Notes for the quote",`<textarea oninput="setE('notes',this.value)">${E.notes}</textarea>`)}</div></div></div>
    <div class="panel"><h3>Quote adjustments</h3><div class="form-grid">${field("Discount ($)",inp("adj.discount","0","number",'inputmode="decimal" min="0"'))}${field("Custom charge ($)",inp("adj.custom","0","number",'inputmode="decimal"'))}<div class="full">${field("Custom charge label",inp("adj.customLabel","e.g. Adhesive removal"))}</div><div class="full">${field("Actual labor hours (internal, optional)",inp("adj.laborHours","","number",'inputmode="decimal" min="0" step="0.25"'),"Record real completion time to compare with the estimate; does not change the customer price")}</div></div></div>
  </div><div class="res-col" id="results">${vResults()}</div></div>`;
}

function vResults(){
  if(!R||R.empty)return `<div class="empty soft"><h3>Select services and enter the job details</h3><p>The customer price builds line by line here. Internal costs and margin stay in a separate, collapsed section that never prints on the quote.</p></div>`;
  const sub=R.subTotal, subPctAvg=R.final?sub/R.final:0;
  return `<div class="summary">
    <div class="row sp"><span class="lbl">${{low:"Low",rec:"Recommended",prem:"Premium"}[R.tier]} price · ${R.standalone?"standalone visit":"combined visit, "+R.groups.length+" services"}</span>${R.pending.length?`<span class="pill pend">${R.pending.length} pending rate${R.pending.length>1?"s":""}</span>`:""}</div>
    <div class="num">${$(R.final)}</div>
    <div class="per">${R.adjusted?`Calculated ${$(R.calcPrice)} → adjusted ${$(R.final)} · `:""}${R.minAdj?`includes +${$(R.minAdj)} to reach the $${S.standaloneMin} visit minimum · `:""}${R.laborHours.toFixed(1)} est. labor-hours</div>
    <div class="tierbtns">${[["low","Low","−"+Math.abs(S.tiers.low)+"%"],["rec","Recommended","market"],["prem","Premium","+"+S.tiers.prem+"%"]].map(([k,l,s])=>`<button class="${E.tier===k?"on":""}" onclick="setE('tier','${k}',true)"><small>${l} · ${s}</small><b>${$(R.tierPrices[k])}</b></button>`).join("")}</div>
    <div class="acts"><button class="btn primary" onclick="downloadPDF()">${ic("print")} Download PDF quote</button><button class="btn ghost" onclick="openQuote()">Preview</button><button class="btn ghost" onclick="go('estimate')">${ic("plus")} New</button></div>
  </div>
  ${R.minAdj?`<div class="note info">${ic("info")}<div>Visit minimum applied: calculated ${$(R.subtotal)}, charged ${$(S.standaloneMin)}.</div></div>`:""}${R.recurring?`<div class="note ok">${ic("check")}<div><b>Recurring ${R.recurring.label}:</b> ${$(R.recurring.price)} per visit, ${R.recurring.freq}, after the first visit.</div></div>`:""}
  ${R.resBE&&R.final<R.resBE?`<div class="note crit">${ic("warn")}<div><b>Below residential break-even (${$(R.resBE)}).</b> A price above $${S.standaloneMin} does not mean it is profitable.</div></div>`:""}
  ${R.pending.map(p=>`<div class="note warn">${ic("info")}<div>${p}</div></div>`).join("")}
  <div class="card"><h3 style="margin-bottom:6px">Price breakdown</h3><div class="lines">
    ${R.groups.map(g=>`<div class="grp"><span>${g.name}</span><span>${$(g.total)}</span></div>${g.lines.map(l=>`<div><span>${l.n}${l.pend?' <span class="pill pend">pending</span>':''}<small>${l.s}</small></span><b>${$(l.v)}</b></div>`).join("")}`).join("")}
    ${R.minAdj?`<div><span>Visit minimum<small>MAX($${S.standaloneMin}, calculated)</small></span><b>+${$(R.minAdj)}</b></div>`:""}
    ${R.discount?`<div class="disc"><span>Discount</span><b>−${$(R.discount)}</b></div>`:""}
    ${R.custom?`<div><span>${E.adj.customLabel||"Custom charge"}</span><b>${$(R.custom)}</b></div>`:""}
    <div class="tot"><span>Customer price</span><b>${$(R.final)}</b></div></div></div>
  <details class="card"><summary><h3>Internal · costs & margin (never on the quote)</h3>${ic("chev","chev")}</summary><div class="body">
    <div class="kv">
      <div><div class="k">Estimated labor</div><div class="v">${$(R.laborCost)}</div><div class="tiny sub">${R.laborHours.toFixed(1)} h × ${$(S.labor.hourly*(1+S.labor.burden/100),2)} loaded</div></div>
      <div><div class="k">Subcontractor payment</div><div class="v">${$(sub)}</div><div class="tiny sub">${sub?pct(subPctAvg)+" of customer price":"none"}</div></div>
      <div><div class="k">Gross profit</div><div class="v">${$(R.gross)}</div><div class="tiny sub">before overhead, not net profit</div></div>
      <div><div class="k">Gross margin</div><div class="v">${pct(R.gm)}</div></div>
      ${R.resBE?`<div><div class="k">Residential break-even</div><div class="v">${$(R.resBE)}</div><div class="tiny sub">$${S.breakevenRate}/h table</div></div>`:""}
      ${E.adj.laborHours?`<div><div class="k">Actual hours recorded</div><div class="v">${num(E.adj.laborHours).toFixed(1)} h</div></div>`:""}
    </div>
    ${R.groups.filter(g=>g.subPct).map(g=>`<div class="note ${g.subPct>S.sub.flagAbove?"crit":"ok"}" style="margin-top:12px">${ic(g.subPct>S.sub.flagAbove?"warn":"check")}<div><b>${g.name}:</b> subcontractor ${g.subPct}% = ${$(g.sub)} → gross margin ${pct(1-g.subPct/100)} (${$(g.total-g.sub)}) before other costs.${g.subPct>S.sub.flagAbove?" Above "+S.sub.flagAbove+"%: needs approval.":""}</div></div>`).join("")}
    ${R.groups.filter(g=>g.refPrice).map(g=>`<p class="tiny sub" style="margin-top:10px">${g.name} time reference: ${g.refHours.toFixed(1)} labor-hours ≈ ${$(g.refPrice)} at $${S.refRate}/h (mathematical reference, not a price).</p>`).join("")}
  </div></details>`;
}

function openQuote(){
  if(!R||R.empty)return toast("Fill in the job first");const c=S.company,d=new Date();
  document.getElementById("quote").innerHTML=`<div class="tools"><button class="btn ghost sm" onclick="window.print()">${ic("print")} Print / Save PDF</button><button class="btn ghost sm" onclick="closeQuote()">${ic("x")} Close</button></div>
    <div class="qhead"><div class="wordmark" style="margin:0">${wordmark()}</div><div class="co"><b style="color:#0E3A5D">${c.name}</b><br>${c.city}<br>${c.phone} · ${c.email}</div></div>
    <div class="qtitle"><span style="font-family:var(--script);color:#BD9B4E;font-size:22px;display:block;line-height:1">Clean your home</span>Service Estimate</div><div class="qsub">Prepared for ${E.client||"—"} · ${d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}</div>
    <div class="qgrid"><div><div class="k">Client</div><div class="v">${E.client||"—"}</div></div><div><div class="k">Property</div><div class="v">${E.address||"—"}</div></div><div><div class="k">Services</div><div class="v">${R.groups.map(g=>g.name).join(", ")}</div></div><div><div class="k">Visit</div><div class="v">${R.standalone?"Single service":"Combined visit"}${R.tier!=="rec"?" · "+{low:"Value",prem:"Premium"}[R.tier]+" package":""}</div></div></div>
    <div class="qlines">${R.groups.map(g=>`<div class="grp"><span>${g.name}</span><span></span></div>${g.lines.map(l=>`<div><span>${l.n}</span><span>${$(l.v)}</span></div>`).join("")}`).join("")}${R.minAdj?`<div><span>Minimum service visit</span><span>${$(R.minAdj)}</span></div>`:""}${R.discount?`<div><span>Discount</span><span>−${$(R.discount)}</span></div>`:""}${R.custom?`<div><span>${E.adj.customLabel||"Additional charge"}</span><span>${$(R.custom)}</span></div>`:""}</div>
    <div class="total"><div class="l">Total<small>Licensed & insured · eco-friendly products · 100% satisfaction guarantee</small></div><div class="p">${$(R.final)}</div></div>
    ${R.recurring?`<div style="margin-top:12px;padding:14px 18px;border-radius:14px;background:#FDF4F0;display:flex;justify-content:space-between;gap:12px;font-size:14px"><span><b style="color:#1F4F72">Recurring ${R.recurring.label} service</b><br><span style="color:#66717D;font-size:12.5px">Per visit, ${R.recurring.freq}, starting after the first visit</span></span><b style="color:#1F4F72;font-size:20px;font-family:var(--head)">${$(R.recurring.price)}</b></div>`:""}
    ${E.notes?`<p style="margin-top:16px;font-size:13.5px;color:#3C4854"><b>Notes:</b> ${E.notes}</p>`:""}
    <div class="qfoot"><span>${c.web}</span><span>${c.phone}</span><span>Cash, check or Zelle · no long-term contracts</span></div>`;
  document.getElementById("modal").classList.add("show");
}
function downloadPDF(){openQuote();setTimeout(()=>window.print(),400)}
function closeQuote(){document.getElementById("modal").classList.remove("show")}

/* ===================== SETTINGS ===================== */
function setS(path,v){const p=path.split(".");let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=(isNaN(parseFloat(v))||path.startsWith("company"))?v:parseFloat(v);store("csm_settings_v4",S)}
function sf(l,path,h="",stp="any",type="number"){const v=path.split(".").reduce((o,k)=>o[k],S);return field(l,`<input type="${type}" step="${stp}" ${type==="number"?'inputmode="decimal"':""} value="${v}" onchange="setS('${path}',this.value)">`,h)}
function setAbTurn(r,c,v){S.airbnb.turn[r][c]=parseFloat(v)||0;store("csm_settings_v4",S)}
function setAbTier(r,c,v){S.airbnb.tiers[r][c]=parseFloat(v)||0;store("csm_settings_v4",S)}
function setTbl(t,r,c,v){S[t][r][c]=parseFloat(v)||0;store("csm_settings_v4",S)}
function setAddon(i,f,v){S.addons[i][f]=(f===2)?(parseFloat(v)||0):v;store("csm_settings_v4",S)}
function delAddon(i){S.addons.splice(i,1);store("csm_settings_v4",S);render()}
function addAddon(){S.addons.push(["x"+Date.now(),"New add-on",25,"per visit"]);store("csm_settings_v4",S);render()}
function vSettings(){
  const tbl=(t,title,cls)=>`<div class="section-title" style="margin:24px 0 10px"><h2>${title}</h2></div><div class="card" style="padding:4px 0"><div class="tbl-wrap"><table class="list"><thead><tr><th>Up to ft²</th>${S.resTypes.map(x=>`<th class="num">${x[1]}</th>`).join("")}</tr></thead><tbody>${S[t].map((row,r)=>`<tr><td><input class="cell num" type="number" value="${row[0]}" onchange="setTbl('${t}',${r},0,this.value)" style="text-align:left"></td>${row.slice(1).map((v,c)=>`<td class="num"><input class="cell num" type="number" value="${v}" onchange="setTbl('${t}',${r},${c+1},this.value)"></td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  const prev=S.resRef.map(x=>x[0]).map(s=>`<tr><td>${s.toLocaleString()}</td>${S.resTypes.map((t,i)=>`<td class="num">${$(resPrice(s,i,false))}</td>`).join("")}</tr>`).join("");
  return `<div class="page-head"><div><div class="eyebrow">Admin</div><h1>Settings & rates</h1><p class="sub">Three kinds of numbers: <span class="pill info">reference</span> from the 7FC sheet, <span class="pill ok">approved</span> rules from the business discussion, <span class="pill pend">pending</span> proposals. Nothing here turns a proposal into an approved price by itself.</p></div></div>
  <div class="grid g2">
    <div class="card"><h3 style="margin-bottom:12px">Approved rules <span class="pill ok">approved</span></h3><div class="form-grid">${sf("Standalone visit minimum ($)","standaloneMin","Applies to every visit, recurring visits included")}${sf("Power washing $/ft²","power.rate","Replaces the old $0.35","0.01")}${sf("Laundry per load ($)","laundry.perLoad","First load included")}${sf("Flag subcontractor payment above %","sub.flagAbove")}${sf("Low tier vs recommended (%)","tiers.low","Negative = below recommended")}${sf("Premium tier vs recommended (%)","tiers.prem")}</div></div>
    <div class="card"><h3 style="margin-bottom:12px">Residential structure <span class="pill info">reference</span></h3><div class="form-grid">${sf("Bracket size (ft²)","resStep","500 = exact prices from the table by 500 ft² bracket")}${sf("Proposed reduction vs reference (%)","resAdjust","0 = reference prices. Any other value is shown as a proposed adjustment on every quote")}${sf("Reference calc rate ($/h)","refRate","Pricing reference only, not a wage or selling rate")}${sf("Break-even rate ($/h)","breakevenRate")}</div></div>
    <div class="card"><h3 style="margin-bottom:12px">Airbnb · per ft² rates</h3><div class="tbl-wrap"><table class="list" style="min-width:0"><thead><tr><th>Up to ft²</th><th class="num">Standard</th><th class="num">Heavy-duty</th><th class="num">Deep</th></tr></thead><tbody>${S.airbnb.tiers.map((t,i)=>`<tr><td>${i===S.airbnb.tiers.length-1?"4,001+":`<input class="cell num" type="number" value="${t[0]}" onchange="setAbTier(${i},0,this.value)" style="text-align:left">`}</td>${[1,2,3].map(c=>`<td class="num"><input class="cell num" type="number" step="0.01" value="${t[c]}" onchange="setAbTier(${i},${c},this.value)"></td>`).join("")}</tr>`).join("")}</tbody></table></div><div class="form-grid" style="margin-top:12px">${sf("Per bed prepared ($)","airbnb.perBed","0 = included")}${sf("Refrigerator & kitchen ($)","airbnb.fridge","0 = included")}${sf("Dishes / dishwasher ($)","airbnb.dishes","0 = included")}${sf("Leftover food removal ($)","airbnb.foodRemoval","0 = included")}</div><p class="tiny sub" style="margin-top:10px">Example 3,000 ft²: standard $390, heavy-duty $540, deep $660. Time references: 250 ft²/h at 1,000 ft², 333 at 2,000, 375 at 3,000.</p></div>
    <div class="card"><h3 style="margin-bottom:12px">Carpet <span class="pill pend">supplier rate pending</span></h3><div class="form-grid">${sf("Selling $/ft² (preliminary)","carpet.rate","","0.01")}${sf("Per room reference ($)","carpet.perRoom","$230 / 3 rooms","0.01")}${sf("Default subcontractor payment %","carpet.subPct")}${sf("Supplier standard rate ($/ft²)","carpet.supplierStd","Fill in once confirmed","0.01")}${sf("Negotiated rate ($/ft²)","carpet.supplierNeg","","0.01")}${sf("Supplier minimum charge ($)","carpet.supplierMin")}</div></div>
    <div class="card"><h3 style="margin-bottom:12px">Post-construction <span class="pill pend">thresholds not set</span></h3><div class="form-grid">${sf("Small project up to (ft²)","postcon.thresholds.small")}${sf("Medium project up to (ft²)","postcon.thresholds.medium")}${["rough","final","touch"].map(p=>["Small","Medium","Large"].map((s,i)=>sf(`${{rough:"Rough",final:"Final",touch:"Touch-up"}[p]} · ${s} $/ft²`,`postcon.rates.${p}.${i}`,"","0.01")).join("")).join("")}</div><p class="tiny sub" style="margin-top:10px">History: ~$0.30/ft² to one contractor; a store at $0.45/ft² per visit; a 370,000 ft² project over $280,000 with three phases, windows and power washing. References only.</p></div>
    <div class="card"><h3 style="margin-bottom:12px">Internal labor & subcontractors</h3><div class="form-grid">${sf("Cleaner hourly wage ($)","labor.hourly")}${sf("Payroll burden %","labor.burden")}${sf("Residential ft²/labor-hour","labor.production.residential")}${sf("Power washing ft²/labor-hour","labor.production.power")}${sf("Post-con ft²/labor-hour (rough)","labor.production.postcon")}${sf("Power washing sub payment % (0 = in-house)","sub.power")}${sf("Post-con sub payment % (0 = in-house)","sub.postcon")}</div></div>
  </div>
  <div class="section-title" style="margin:24px 0 10px"><h2>Airbnb turnover pricing by square footage</h2><span class="sub small">Low uses the minimum column, Recommended the suggested column, Premium adds ${S.tiers.prem}%</span></div>
  <div class="card" style="padding:4px 0"><div class="tbl-wrap"><table class="list" style="min-width:880px"><thead><tr><th>Up to ft²</th><th class="num">Est. hours</th>${Object.values(AB_TURN).map(t=>`<th class="num">${t[0]}<br>suggested</th><th class="num">minimum</th>`).join("")}</tr></thead><tbody>${S.airbnb.turn.map((r,i)=>`<tr>${r.map((v,c)=>`<td class="num"><input class="cell num" type="number" step="${c===1?"0.1":"1"}" value="${v}" onchange="setAbTurn(${i},${c},this.value)"></td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
  ${tbl("resRef","Residential reference prices (recommended, $50/h sheet)")}
  ${tbl("resBE","Residential break-even reference ($32.19/h sheet)")}
  <div class="section-title" style="margin:24px 0 10px"><h2>Preview · prices charged per visit</h2><span class="sub small">What the calculator charges with the current settings</span></div>
  <div class="card" style="padding:4px 0"><div class="tbl-wrap"><table class="list"><thead><tr><th>ft²</th>${S.resTypes.map(x=>`<th class="num">${x[1]}</th>`).join("")}</tr></thead><tbody>${prev}</tbody></table></div></div>
  <div class="section-title" style="margin:24px 0 10px"><h2>Add-on menu</h2><span class="sub small">Confirm which stay active and the charging unit</span></div>
  <div class="card" style="padding:4px 0"><div class="tbl-wrap"><table class="list"><thead><tr><th>Add-on</th><th class="num">Price ($)</th><th>Unit</th><th></th></tr></thead><tbody>${S.addons.map((a,i)=>`<tr><td><input class="cell" value="${a[1]}" onchange="setAddon(${i},1,this.value)"></td><td class="num"><input class="cell num" type="number" value="${a[2]}" onchange="setAddon(${i},2,this.value)"></td><td><input class="cell" value="${a[3]}" onchange="setAddon(${i},3,this.value)"></td><td style="text-align:right"><button class="btn danger sm" onclick="delAddon(${i})">${ic("trash")}</button></td></tr>`).join("")}</tbody></table></div><div style="padding:12px 14px"><button class="btn ghost sm" onclick="addAddon()">${ic("plus")} Add</button></div></div>
  <div class="card" style="margin-top:16px"><h3 style="margin-bottom:12px">Company (on quotes)</h3><div class="form-grid"><div class="full">${sf("Name","company.name","","","text")}</div>${sf("Phone","company.phone","","","text")}${sf("Email","company.email","","","text")}${sf("Website","company.web","","","text")}${sf("City","company.city","","","text")}</div></div>
  <div style="margin-top:22px"><button class="btn ghost" onclick="if(confirm('Restore all defaults?')){S=JSON.parse(JSON.stringify(DEFAULTS));store('csm_settings_v4',S);render();toast('Defaults restored')}">Restore defaults</button></div>`;
}
render();
</script>
</body>
</html>
